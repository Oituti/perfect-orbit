<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-85DVRJWEC2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-85DVRJWEC2');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Perfect Orbit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gameCanvas"></canvas>

<!-- 右上オーディオコントロール -->
<div id="audioControls">
    <div class="audio-item">
        <span class="audio-label">TRACK</span>
        <select id="bgmSelect">
            <option value="random">RANDOM</option>
            <option value="bgm.mp3">Track 01 (Ambient)</option>
            <option value="05 meteor shower.mp3">Track 02 (Meteor Shower)</option>
            <option value="07 Argo Navis.mp3">Track 03 (Argo Navis)</option>
            <option value="08 ウラノメトリア.mp3">Track 04 (Uranometria)</option>
        </select>
    </div>
    <div class="audio-item">
        <span class="audio-label">VOL</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.4">
    </div>
</div>

<!-- UI レイヤー -->
<div id="uiLayer">

    <!-- メニュー画面 -->
    <div id="menuUI" class="ui-screen">
        <div class="title-container">
            <h1 class="title-text">PERFECT ORBIT</h1>
            <p class="subtitle">ORBITAL DRAWING EXPERIMENT</p>
        </div>
        <div class="button-group">
            <button id="btnEarth" class="mode-btn mode-earth">
                <svg class="mode-icon" viewBox="0 0 100 60" aria-hidden="true">
                    <circle cx="50" cy="30" r="4" fill="#ffcf56" opacity="0.6"/>
                    <circle cx="50" cy="30" r="22" fill="none" stroke="#49d5b6" stroke-width="1.5" stroke-dasharray="3 3"/>
                    <circle cx="72" cy="30" r="3" fill="#49d5b6"/>
                </svg>
                <div class="btn-text-wrap">
                    <span class="btn-title">EARTH</span>
                    <span class="btn-desc">地球 · 円軌道 (難易度: ★☆☆)</span>
                </div>
            </button>
            <button id="btnComet" class="mode-btn mode-comet">
                <svg class="mode-icon" viewBox="0 0 100 60" aria-hidden="true">
                    <circle cx="38" cy="30" r="4" fill="#ffcf56" opacity="0.6"/>
                    <ellipse cx="50" cy="30" rx="36" ry="12" fill="none" stroke="#ff5e3a" stroke-width="1.5" stroke-dasharray="3 3"/>
                    <line x1="86" y1="30" x2="94" y2="27" stroke="#ff5e3a" stroke-width="1" opacity="0.6"/>
                    <circle cx="86" cy="30" r="2.5" fill="#ff5e3a"/>
                </svg>
                <div class="btn-text-wrap">
                    <span class="btn-title">COMET</span>
                    <span class="btn-desc">彗星 · 楕円軌道 (難易度: ★★★)</span>
                </div>
            </button>
        </div>
    </div>

    <!-- プレイ中ガイド -->
    <div id="playingUI" class="ui-screen hidden">
        <div id="targetText" class="target-text">EARTH ORBIT</div>
    </div>

    <!-- リザルト画面 -->
    <div id="resultUI" class="ui-screen hidden">
        <div class="result-card">
            <div id="evalText" class="eval-text">GREAT</div>
            <div class="score-container">
                <div id="scoreText" class="score-text">00.0%</div>
                <div id="bestText" class="best-text">BEST 00.0%</div>
            </div>
        </div>

        <button id="btnShare" class="share-btn">SHARE ON 𝕏</button>

        <div class="trivia-box">
            <span class="trivia-tag">LOG NOTE</span>
            <p id="triviaText" class="trivia-text">---</p>
        </div>
        <p class="retry-hint">Tap anywhere to retry</p>
    </div>

</div>

<script src="main.js"></script>
</body>
</html>
